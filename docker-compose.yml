services:
  postgres:
    image: postgres:16
    container_name: sme-profit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sme_profit
      POSTGRES_USER: sme_user
      POSTGRES_PASSWORD: sme_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: